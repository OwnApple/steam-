<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Steam 推荐系统{% endblock %}</title>
    <!-- 引入 Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1b2838;
            color: #c7d5e0;
            font-family: "Motiva Sans", Sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏模仿 Steam 风格 */
        .navbar-steam {
            background-color: #171a21;
            padding: 15px 30px;
        }
        .navbar-steam .navbar-brand {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .navbar-steam .nav-link {
            color: #b8b6b4 !important;
        }
        .navbar-steam .nav-link:hover {
            color: #fff !important;
        }

        /* 主体内容区域 */
        .content-area {
            flex-grow: 1;
            padding: 20px 0;
        }

        /* 底部 */
        .footer {
            background-color: #171a21;
            padding: 20px 0;
            text-align: center;
            color: #8f98a0;
            margin-top: 40px;
        }

        /* 通用卡片及表单风格优化 */
        .steam-card {
            background-color: #2a475e;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-steam">
        <a class="navbar-brand" href="{{ url_for('index') }}">🎮 Steam Recommender</a>
        <div class="collapse navbar-collapse d-flex justify-content-end">
            <ul class="navbar-nav">
                {% if g.user %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('profile') }}">个人中心 ({{ g.user.username }})</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning" href="{{ url_for('logout') }}">注销</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('login') }}">登录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('register') }}">注册</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <div class="content-area container-fluid">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container">
            <span>&copy; {{ range(2023, 2027) | last }} 推荐系统课程设计 - 游戏探索</span>
        </div>
    </footer>

    <!-- 引入 jQuery 和 Bootstrap JS 供全局使用 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
